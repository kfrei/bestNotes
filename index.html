<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=5" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
    <link rel="manifest" href="/manifest.json?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="BestNotes" />
    <meta name="theme-color" content="#1b2a4a" />
    <title>BestNotes — Σημειώσεις, Γραφιστικά & Μαθηματικά</title>
    <script>
      if (window.location.hostname.indexOf('explainboard') !== -1 || window.location.search.indexOf('explainboard') !== -1) {
        document.title = 'ExplainBoards — Σημειώσεις, Γραφιστικά & Μαθηματικά';
        var icons = document.querySelectorAll('link[rel*="icon"]');
        icons.forEach(function (el) {
          el.setAttribute('type', 'image/png');
          el.setAttribute('href', '/explainboards-icon.png?v=1');
        });
        var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (appTitle) appTitle.setAttribute('content', 'ExplainBoards');
      }
      var ua = navigator.userAgent || '';
      var isIPadOrIOS =
        /iPad|iPhone|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isThirdPartyIOSBrowser = /CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
      if (
        window.navigator.standalone === true ||
        (window.matchMedia &&
          (window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.matchMedia('(display-mode: minimal-ui)').matches ||
            window.matchMedia('(display-mode: window-controls-overlay)').matches)) ||
        (isIPadOrIOS && !isThirdPartyIOSBrowser)
      ) {
        document.documentElement.setAttribute('data-standalone-app', 'true');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,500;0,700;1,500;1,700&family=Arima:wght@500;600;700&family=Comic+Relief:wght@400;700&family=GFS+Neohellenic:ital,wght@0,400;0,700;1,400;1,700&family=Mansalva&family=Mynerve&family=Playpen+Sans:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Ysabeau+Infant:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
    <style>

      .bn-safe-top-header {
        padding-top: max(env(safe-area-inset-top, 0px), 6px);
      }
      @media all and (display-mode: standalone), all and (display-mode: fullscreen), all and (display-mode: minimal-ui) {
        .bn-safe-top-header {
          padding-top: max(env(safe-area-inset-top, 0px), 46px) !important;
          padding-bottom: 4px !important;
        }
      }
      html[data-standalone-app='true'] .bn-safe-top-header {
        padding-top: max(env(safe-area-inset-top, 0px), 46px) !important;
        padding-bottom: 4px !important;
      }
      textarea[data-ghost-textarea='true']::selection,
      textarea[data-ghost-textarea='true']::-moz-selection {
        background: transparent !important;
        background-color: transparent !important;
        color: transparent !important;
      }
    </style>
