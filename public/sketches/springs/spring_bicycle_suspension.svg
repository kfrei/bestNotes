<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="512" height="512">
  <defs>
    <linearGradient id="bikeShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3c5a6" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#b5835a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6b3c1d" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <g stroke="#5a3015" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bicycle front wheel with spokes -->
    <circle cx="152" cy="164" r="56" stroke-width="5.5" stroke="#4a2510"/>
    <circle cx="152" cy="164" r="49" stroke-width="2" stroke="#7c4824" fill="#f5e6d6" fill-opacity="0.18"/>
    <circle cx="152" cy="164" r="14" stroke-width="2" fill="#d7b18e" fill-opacity="0.5"/>
    <circle cx="152" cy="164" r="6" fill="#5a3015" stroke="none"/>
    <!-- Spokes -->
    <g stroke="#7c4824" stroke-width="1.1" stroke-opacity="0.65">
      <line x1="152" y1="115" x2="152" y2="213"/>
      <line x1="103" y1="164" x2="201" y2="164"/>
      <line x1="117" y1="129" x2="187" y2="199"/>
      <line x1="187" y1="129" x2="117" y2="199"/>
      <line x1="133" y1="118" x2="171" y2="210"/>
      <line x1="171" y1="118" x2="133" y2="210"/>
      <line x1="106" y1="145" x2="198" y2="183"/>
      <line x1="198" y1="145" x2="106" y2="183"/>
    </g>

    <!-- Handlebar & stem -->
    <path d="M 54 32 L 86 38 L 96 52" stroke-width="5" stroke="#4a2510"/>
    <rect x="40" y="25" width="22" height="10" rx="4" transform="rotate(10 51 30)" fill="#7c4824" fill-opacity="0.7" stroke-width="2.2"/>
    <!-- Frame headtube & top/down tubes -->
    <path d="M 96 52 L 32 76" stroke-width="5.5" stroke="#5a3015"/>
    <path d="M 103 70 L 42 132" stroke-width="5.5" stroke="#5a3015"/>
    <rect x="86" y="47" width="16" height="28" rx="3" transform="rotate(-24 94 61)" fill="url(#bikeShade)" stroke-width="2.4"/>

    <!-- Suspension Fork Crown -->
    <rect x="97" y="71" width="24" height="10" rx="3" transform="rotate(-24 109 76)" fill="#9c663b" fill-opacity="0.65" stroke-width="2.4"/>

    <!-- Central stanchion tube inside spring -->
    <line x1="112" y1="81" x2="152" y2="164" stroke-width="7.5" stroke="#c79a72" stroke-opacity="0.7"/>
    <line x1="112" y1="81" x2="152" y2="164" stroke-width="2" stroke="#5a3015"/>

    <!-- Highlighted Telescopic Fork Coil Spring -->
    <g transform="rotate(-25.5 126 112)">
      <path d="M 114 82 C 114 78, 138 78, 138 83 C 138 88, 114 87, 114 92 C 114 97, 138 96, 138 101 C 138 106, 114 105, 114 110 C 114 115, 138 114, 138 119 C 138 124, 114 123, 114 128 C 114 133, 138 132, 138 137" stroke="#4a2510" stroke-width="4.2"/>
      <path d="M 116 83 C 122 80, 132 80, 136 83 M 116 92 C 122 89, 132 89, 136 92 M 116 101 C 122 98, 132 98, 136 101 M 116 110 C 122 107, 132 107, 136 110 M 116 119 C 122 116, 132 116, 136 119 M 116 128 C 122 125, 132 125, 136 128" stroke="#f5e6d6" stroke-width="1.3"/>
      <!-- Lower fork slider -->
      <rect x="118" y="138" width="16" height="36" rx="4" fill="url(#bikeShade)" stroke-width="2.6"/>
    </g>

    <!-- Subtle motion/compression arrows beside suspension -->
    <g stroke="#7c4824" stroke-width="1.8" stroke-dasharray="3 2.5">
      <line x1="158" y1="68" x2="169" y2="92"/>
    </g>
    <polyline points="154,74 158,68 164,71" stroke="#7c4824" stroke-width="1.8"/>
    <polyline points="163,89 169,92 172,85" stroke="#7c4824" stroke-width="1.8"/>

    <!-- Ground shadow hatching -->
    <line x1="94" y1="224" x2="210" y2="224" stroke="#7c4824" stroke-width="1.6" stroke-opacity="0.5"/>
    <line x1="112" y1="229" x2="192" y2="229" stroke="#7c4824" stroke-width="1.1" stroke-opacity="0.35"/>
  </g>
</svg>
