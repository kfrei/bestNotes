<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="512" height="512">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c99e77" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#f5e6d6" stop-opacity="0.75"/>
      <stop offset="75%" stop-color="#b9875d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c4824" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="weightGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c4824" stop-opacity="0.75"/>
      <stop offset="38%" stop-color="#d7b18e" stop-opacity="0.75"/>
      <stop offset="80%" stop-color="#6b3c1d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4a2510" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <g stroke="#5a3015" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top hanging ring -->
    <circle cx="120" cy="24" r="11" stroke-width="3.2" fill="#e7ccb2" fill-opacity="0.35"/>
    <circle cx="120" cy="24" r="6" stroke-width="1.4" stroke="#7c4824"/>
    <rect x="115" y="34" width="10" height="8" rx="2" fill="#9c663b" fill-opacity="0.45" stroke-width="2.2"/>

    <!-- Main dynamometer cylinder body -->
    <rect x="94" y="42" width="52" height="106" rx="10" fill="url(#bodyGrad)" stroke-width="2.8"/>
    <!-- Engraving vertical shading lines on cylinder -->
    <line x1="101" y1="50" x2="101" y2="140" stroke="#7c4824" stroke-width="1" stroke-opacity="0.45"/>
    <line x1="139" y1="50" x2="139" y2="140" stroke="#5a3015" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="142" y1="52" x2="142" y2="138" stroke="#5a3015" stroke-width="0.9" stroke-opacity="0.35"/>

    <!-- Center viewing slot -->
    <rect x="109" y="54" width="22" height="82" rx="6" fill="#fffaf4" fill-opacity="0.85" stroke-width="2"/>

    <!-- Visible helical spring inside the slot -->
    <line x1="120" y1="55" x2="120" y2="62" stroke-width="2.2"/>
    <path d="M 113 64 C 113 61, 127 61, 127 65 C 127 69, 113 68, 113 72 C 113 76, 127 75, 127 79 C 127 83, 113 82, 113 86 C 113 90, 127 89, 127 93 C 127 97, 113 96, 113 100 C 113 104, 127 103, 127 107" stroke-width="2.4" stroke="#4a2510"/>
    <!-- Pointer marker -->
    <line x1="107" y1="110" x2="133" y2="110" stroke="#4a2510" stroke-width="2.8"/>
    <polygon points="103,107 109,110 103,113" fill="#5a3015" stroke="none"/>
    <polygon points="137,107 131,110 137,113" fill="#5a3015" stroke="none"/>

    <!-- Scale tick marks (left & right of slot) -->
    <g stroke="#5a3015" stroke-width="1.3">
      <line x1="99" y1="62" x2="107" y2="62"/>
      <line x1="102" y1="70" x2="107" y2="70"/>
      <line x1="99" y1="78" x2="107" y2="78"/>
      <line x1="102" y1="86" x2="107" y2="86"/>
      <line x1="99" y1="94" x2="107" y2="94"/>
      <line x1="102" y1="102" x2="107" y2="102"/>
      <line x1="99" y1="110" x2="107" y2="110"/>
      <line x1="102" y1="118" x2="107" y2="118"/>
      <line x1="99" y1="126" x2="107" y2="126"/>

      <line x1="133" y1="62" x2="141" y2="62"/>
      <line x1="133" y1="78" x2="141" y2="78"/>
      <line x1="133" y1="94" x2="141" y2="94"/>
      <line x1="133" y1="110" x2="141" y2="110"/>
      <line x1="133" y1="126" x2="141" y2="126"/>
    </g>
    <text x="120" y="144" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#5a3015" stroke="none">N</text>

    <!-- Lower pull rod & hook -->
    <line x1="120" y1="111" x2="120" y2="165" stroke-width="2.6"/>
    <path d="M 120 165 C 120 175, 130 176, 130 169 C 130 165, 126 163, 124 165" stroke-width="2.6"/>

    <!-- Hanging calibrated weight -->
    <circle cx="120" cy="179" r="5" stroke-width="2.2" fill="#e7ccb2" fill-opacity="0.4"/>
    <path d="M 103 185 L 137 185 L 142 222 C 142 226, 98 226, 98 222 Z" fill="url(#weightGrad)" stroke-width="2.6"/>
    <ellipse cx="120" cy="185" rx="17" ry="4" fill="#d7b18e" fill-opacity="0.6" stroke-width="1.8"/>
    <!-- Engraving cross-hatching on weight -->
    <g stroke="#4a2510" stroke-width="0.9" stroke-opacity="0.4">
      <line x1="106" y1="194" x2="104" y2="217"/>
      <line x1="110" y1="194" x2="109" y2="218"/>
      <line x1="131" y1="194" x2="133" y2="218"/>
      <line x1="135" y1="194" x2="138" y2="217"/>
    </g>
    <text x="120" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#4a2510" stroke="none">m</text>
  </g>
</svg>
