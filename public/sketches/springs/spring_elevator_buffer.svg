<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="512" height="512">
  <defs>
    <linearGradient id="elevWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c99e77" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#f5e6d6" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#8c5730" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <g stroke="#5a3015" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Elevator shaft side walls & vertical guide rails -->
    <rect x="34" y="14" width="172" height="212" rx="4" fill="#f5e6d6" fill-opacity="0.22" stroke="#7c4824" stroke-width="2.4"/>
    <line x1="50" y1="14" x2="50" y2="212" stroke="#5a3015" stroke-width="3.2"/>
    <line x1="190" y1="14" x2="190" y2="212" stroke="#5a3015" stroke-width="3.2"/>

    <!-- Suspension cables at top -->
    <line x1="112" y1="14" x2="112" y2="38" stroke="#5a3015" stroke-width="2"/>
    <line x1="120" y1="14" x2="120" y2="38" stroke="#5a3015" stroke-width="2.2"/>
    <line x1="128" y1="14" x2="128" y2="38" stroke="#5a3015" stroke-width="2"/>

    <!-- Elevator Cabin -->
    <rect x="60" y="38" width="120" height="96" rx="4" fill="url(#elevWall)" stroke-width="3"/>
    <!-- Floor indicator display -->
    <rect x="98" y="45" width="44" height="14" rx="3" fill="#4a2510" fill-opacity="0.82" stroke-width="1.6"/>
    <text x="120" y="55.5" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#f5e6d6" stroke="none">▲ 1</text>
    <!-- Sliding double cabin doors -->
    <rect x="76" y="64" width="88" height="64" fill="#fffaf4" fill-opacity="0.72" stroke-width="2.2"/>
    <line x1="120" y1="64" x2="120" y2="128" stroke="#5a3015" stroke-width="2.2"/>
    <!-- Engraving hatching on doors -->
    <g stroke="#7c4824" stroke-width="0.9" stroke-opacity="0.35">
      <line x1="84" y1="70" x2="84" y2="122"/>
      <line x1="156" y1="70" x2="156" y2="122"/>
    </g>

    <!-- Heavy-duty Elevator Pit Spring Buffers (Left & Right) -->
    <!-- Left Buffer -->
    <rect x="76" y="150" width="32" height="7" rx="2" fill="#9c663b" fill-opacity="0.7" stroke-width="2.2"/>
    <path d="M 80 160 C 80 156, 104 156, 104 162 C 104 168, 80 167, 80 173 C 80 179, 104 178, 104 184 C 104 190, 80 189, 80 195 C 80 201, 104 200, 104 205" stroke="#4a2510" stroke-width="4.4"/>
    <path d="M 83 162 L 101 162 M 83 173 L 101 173 M 83 184 L 101 184 M 83 195 L 101 195" stroke="#f5e6d6" stroke-width="1.3"/>
    <rect x="74" y="206" width="36" height="8" rx="2" fill="#6b3c1d" fill-opacity="0.75" stroke-width="2.2"/>

    <!-- Right Buffer -->
    <rect x="132" y="150" width="32" height="7" rx="2" fill="#9c663b" fill-opacity="0.7" stroke-width="2.2"/>
    <path d="M 136 160 C 136 156, 160 156, 160 162 C 160 168, 136 167, 136 173 C 136 179, 160 178, 160 184 C 160 190, 136 189, 136 195 C 136 201, 160 200, 160 205" stroke="#4a2510" stroke-width="4.4"/>
    <path d="M 139 162 L 157 162 M 139 173 L 157 173 M 139 184 L 157 184 M 139 195 L 157 195" stroke="#f5e6d6" stroke-width="1.3"/>
    <rect x="130" y="206" width="36" height="8" rx="2" fill="#6b3c1d" fill-opacity="0.75" stroke-width="2.2"/>

    <!-- Concrete pit floor -->
    <rect x="34" y="214" width="172" height="12" fill="#9c663b" fill-opacity="0.55" stroke-width="2.6"/>
  </g>
</svg>
