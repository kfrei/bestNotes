<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="512" height="512">
  <defs>
    <linearGradient id="keyCapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e6d6" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#c99e77" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c4824" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <g stroke="#5a3015" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Downward press arrow above keycap -->
    <line x1="120" y1="14" x2="120" y2="34" stroke="#7c4824" stroke-width="2.4"/>
    <polyline points="113,27 120,35 127,27" stroke="#7c4824" stroke-width="2.4"/>

    <!-- Sculpted keycap (cutaway front view) -->
    <path d="M 56 44 L 184 44 L 198 92 L 42 92 Z" fill="url(#keyCapGrad)" stroke-width="3"/>
    <path d="M 64 44 L 176 44 L 182 70 L 58 70 Z" fill="#fffaf4" fill-opacity="0.72" stroke-width="1.8"/>
    <text x="120" y="63" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#5a3015" stroke="none">A</text>

    <!-- Switch stem plunging down from keycap -->
    <rect x="108" y="92" width="24" height="32" rx="2" fill="#9c663b" fill-opacity="0.55" stroke-width="2.4"/>

    <!-- Cutaway switch housing showing internal spring -->
    <path d="M 62 114 L 178 114 L 190 194 L 50 194 Z" fill="#e7ccb2" fill-opacity="0.35" stroke-width="2.6"/>
    <!-- Inner open chamber -->
    <rect x="78" y="122" width="84" height="66" rx="4" fill="#fffaf4" fill-opacity="0.9" stroke="#7c4824" stroke-width="1.8" stroke-dasharray="4 2.5"/>

    <!-- Central guide post -->
    <rect x="114" y="124" width="12" height="62" fill="#d7b18e" fill-opacity="0.45" stroke="#7c4824" stroke-width="1.4"/>

    <!-- Helical return spring inside the switch -->
    <path d="M 102 126 C 102 122, 138 122, 138 127 C 138 132, 102 131, 102 136 C 102 141, 138 140, 138 145 C 138 150, 102 149, 102 154 C 102 159, 138 158, 138 163 C 138 168, 102 167, 102 172 C 102 177, 138 176, 138 181 C 138 186, 102 185, 102 187" stroke="#4a2510" stroke-width="3.6"/>
    <path d="M 106 127 L 134 127 M 106 136 L 134 136 M 106 145 L 134 145 M 106 154 L 134 154 M 106 163 L 134 163 M 106 172 L 134 172 M 106 181 L 134 181" stroke="#f5e6d6" stroke-width="1.1" stroke-opacity="0.7"/>

    <!-- Electrical contact leaf (right side inside switch) -->
    <path d="M 150 138 L 150 186" stroke="#7c4824" stroke-width="2.2"/>
    <circle cx="146" cy="156" r="3" fill="#5a3015" stroke="none"/>

    <!-- Keyboard PCB base plate & pins -->
    <rect x="34" y="194" width="172" height="14" rx="3" fill="url(#keyCapGrad)" stroke-width="2.6"/>
    <rect x="92" y="208" width="6" height="16" rx="1.5" fill="#5a3015" stroke="none"/>
    <rect x="142" y="208" width="6" height="16" rx="1.5" fill="#5a3015" stroke="none"/>
  </g>
</svg>
