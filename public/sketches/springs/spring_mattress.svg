<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="512" height="512">
  <defs>
    <linearGradient id="mattressTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf4" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#e7ccb2" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c99e77" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="bedBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c4824" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#b5835a" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5a3015" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <g stroke="#5a3015" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top quilted mattress pillow layer (isometric cutaway) -->
    <path d="M 22 92 L 122 50 L 222 86 L 122 128 Z" fill="url(#mattressTop)" stroke-width="2.8"/>
    <!-- Quilted diamond tufting lines on top -->
    <g stroke="#7c4824" stroke-width="1.2" stroke-opacity="0.55">
      <line x1="56" y1="78" x2="154" y2="114"/>
      <line x1="88" y1="64" x2="188" y2="100"/>
      <line x1="60" y1="106" x2="160" y2="64"/>
      <line x1="92" y1="118" x2="192" y2="76"/>
    </g>
    <!-- Tufting dimple dots -->
    <g fill="#7c4824" stroke="none">
      <circle cx="96" cy="91" r="2.2"/>
      <circle cx="126" cy="78" r="2.2"/>
      <circle cx="156" cy="90" r="2.2"/>
      <circle cx="126" cy="103" r="2.2"/>
    </g>

    <!-- Top foam edge rim -->
    <path d="M 22 92 L 122 128 L 222 86 L 222 100 L 122 142 L 22 106 Z" fill="#e7ccb2" fill-opacity="0.78" stroke-width="2.4"/>

    <!-- Open cutaway interior cavity -->
    <path d="M 28 108 L 122 142 L 216 102 L 216 164 L 122 204 L 28 170 Z" fill="#fffaf4" fill-opacity="0.82" stroke="#7c4824" stroke-width="1.8"/>

    <!-- Row of 5 visible Bonnell hourglass mattress springs -->
    <!-- Back-left & back-right springs (slightly lighter) -->
    <g stroke="#7c4824" stroke-width="2.4" stroke-opacity="0.72">
      <ellipse cx="78" cy="134" rx="13" ry="5"/>
      <path d="M 67 136 C 69 144, 87 144, 89 136 M 69 147 C 71 154, 85 154, 87 147 M 67 159 C 69 167, 87 167, 89 159"/>
      <ellipse cx="78" cy="166" rx="13" ry="5"/>

      <ellipse cx="166" cy="132" rx="13" ry="5"/>
      <path d="M 155 134 C 157 142, 175 142, 177 134 M 157 145 C 159 152, 173 152, 175 145 M 155 157 C 157 165, 175 165, 177 157"/>
      <ellipse cx="166" cy="164" rx="13" ry="5"/>
    </g>

    <!-- Front prominent springs (left, center, right) -->
    <g stroke="#4a2510" stroke-width="2.9">
      <!-- Front Left -->
      <ellipse cx="52" cy="126" rx="14" ry="5.2" fill="#f5e6d6" fill-opacity="0.4"/>
      <path d="M 40 128 C 43 136, 61 136, 64 128 M 43 140 C 46 147, 58 147, 61 140 M 40 152 C 43 160, 61 160, 64 152"/>
      <ellipse cx="52" cy="160" rx="14" ry="5.2"/>

      <!-- Front Center -->
      <ellipse cx="122" cy="150" rx="15" ry="5.5" fill="#f5e6d6" fill-opacity="0.45"/>
      <path d="M 109 152 C 112 161, 132 161, 135 152 M 112 164 C 115 172, 129 172, 132 164 M 109 177 C 112 186, 132 186, 135 177"/>
      <ellipse cx="122" cy="186" rx="15" ry="5.5"/>

      <!-- Front Right -->
      <ellipse cx="192" cy="122" rx="14" ry="5.2" fill="#f5e6d6" fill-opacity="0.4"/>
      <path d="M 180 124 C 183 132, 201 132, 204 124 M 183 136 C 186 143, 198 143, 201 136 M 180 148 C 183 156, 201 156, 204 148"/>
      <ellipse cx="192" cy="156" rx="14" ry="5.2"/>
    </g>

    <!-- Solid wooden bed base layer -->
    <path d="M 22 168 L 122 204 L 222 162 L 222 180 L 122 222 L 22 186 Z" fill="url(#bedBase)" stroke-width="2.8"/>
  </g>
</svg>
