<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="512" height="512">
  <defs>
    <linearGradient id="pistonMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b3c1d" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#f3e2cf" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#9c663b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#4a2510" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <g stroke="#5a3015" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="rotate(-14 120 120)">
    <!-- Top mounting eyelet -->
    <circle cx="120" cy="24" r="13" fill="url(#pistonMetal)" stroke-width="2.8"/>
    <circle cx="120" cy="24" r="6" fill="#fffaf4" stroke-width="2.2"/>
    <rect x="108" y="36" width="24" height="10" rx="2" fill="#9c663b" fill-opacity="0.55" stroke-width="2.2"/>

    <!-- Top spring retainer plate -->
    <rect x="78" y="46" width="84" height="11" rx="4" fill="url(#pistonMetal)" stroke-width="2.6"/>

    <!-- Central hydraulic damper cylinder -->
    <rect x="106" y="57" width="28" height="122" fill="url(#pistonMetal)" stroke-width="2.4"/>
    <line x1="114" y1="59" x2="114" y2="177" stroke="#fffaf4" stroke-width="1.4" stroke-opacity="0.65"/>

    <!-- Back coil segments (darker, behind cylinder) -->
    <g stroke="#7c4824" stroke-width="8" stroke-opacity="0.55">
      <line x1="84" y1="68" x2="156" y2="78"/>
      <line x1="84" y1="90" x2="156" y2="100"/>
      <line x1="84" y1="112" x2="156" y2="122"/>
      <line x1="84" y1="134" x2="156" y2="144"/>
      <line x1="84" y1="156" x2="156" y2="166"/>
    </g>

    <!-- Front heavy-duty helical coils with 3D specular highlight -->
    <g stroke="#4a2510" stroke-width="10.5">
      <path d="M 84 68 C 98 63, 142 63, 156 59"/>
      <path d="M 84 90 C 98 85, 142 83, 156 78"/>
      <path d="M 84 112 C 98 107, 142 105, 156 100"/>
      <path d="M 84 134 C 98 129, 142 127, 156 122"/>
      <path d="M 84 156 C 98 151, 142 149, 156 144"/>
      <path d="M 84 176 C 98 172, 142 170, 156 166"/>
    </g>
    <g stroke="#e7ccb2" stroke-width="3.2">
      <path d="M 88 66 C 102 61, 138 61, 152 57"/>
      <path d="M 88 88 C 102 83, 138 81, 152 76"/>
      <path d="M 88 110 C 102 105, 138 103, 152 98"/>
      <path d="M 88 132 C 102 127, 138 125, 152 120"/>
      <path d="M 88 154 C 102 149, 138 147, 152 142"/>
      <path d="M 88 174 C 102 170, 138 168, 152 164"/>
    </g>

    <!-- Bottom spring retainer plate -->
    <rect x="78" y="179" width="84" height="11" rx="4" fill="url(#pistonMetal)" stroke-width="2.6"/>

    <!-- Lower damper shaft & mounting eyelet -->
    <rect x="112" y="190" width="16" height="18" fill="url(#pistonMetal)" stroke-width="2.4"/>
    <circle cx="120" cy="218" r="13" fill="url(#pistonMetal)" stroke-width="2.8"/>
    <circle cx="120" cy="218" r="6" fill="#fffaf4" stroke-width="2.2"/>
  </g>
</svg>
