<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="512" height="512">
  <defs>
    <linearGradient id="toyBoxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e2cf" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#c79a72" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c4824" stop-opacity="0.78"/>
    </linearGradient>
  </defs>
  <g stroke="#5a3015" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Pop-up smiling star/jester head on top of spring -->
    <g transform="rotate(-8 124 54)">
      <!-- Jester collar -->
      <path d="M 102 74 L 112 84 L 122 76 L 132 84 L 142 74" fill="#d7b18e" fill-opacity="0.6" stroke-width="2.2"/>
      <!-- Smiling face -->
      <circle cx="122" cy="56" r="21" fill="#fffaf4" fill-opacity="0.92" stroke-width="2.8"/>
      <circle cx="115" cy="53" r="2.2" fill="#4a2510" stroke="none"/>
      <circle cx="129" cy="53" r="2.2" fill="#4a2510" stroke="none"/>
      <path d="M 114 62 Q 122 69, 130 62" stroke="#4a2510" stroke-width="2.2"/>
      <!-- Jester hat -->
      <path d="M 103 46 C 95 26, 114 22, 122 36 C 130 22, 149 26, 141 46 Z" fill="url(#toyBoxGrad)" stroke-width="2.4"/>
      <circle cx="98" cy="30" r="4" fill="#c99e77" stroke-width="1.8"/>
      <circle cx="146" cy="30" r="4" fill="#c99e77" stroke-width="1.8"/>
    </g>

    <!-- Bounce motion arcs -->
    <path d="M 80 42 Q 72 52, 76 64" stroke="#7c4824" stroke-width="1.8" stroke-dasharray="3 2.5"/>
    <path d="M 164 40 Q 172 50, 168 62" stroke="#7c4824" stroke-width="1.8" stroke-dasharray="3 2.5"/>

    <!-- Bouncy helical spring emerging from box -->
    <path d="M 110 82 C 110 78, 134 78, 134 84 C 134 90, 106 89, 106 96 C 106 103, 136 102, 136 109 C 136 116, 104 115, 104 122 C 104 129, 138 128, 138 135 C 138 142, 104 141, 104 148" stroke="#4a2510" stroke-width="4.2"/>
    <path d="M 112 84 C 118 81, 126 81, 132 84 M 108 96 C 116 93, 128 93, 134 96 M 106 109 C 116 106, 128 106, 134 109 M 106 122 C 116 119, 128 119, 136 122 M 106 135 C 116 132, 128 132, 136 135" stroke="#f5e6d6" stroke-width="1.3"/>

    <!-- Open hinged lid on left -->
    <path d="M 74 148 L 40 112 L 52 102 L 86 138 Z" fill="url(#toyBoxGrad)" stroke-width="2.6"/>

    <!-- Decorated wooden toy box -->
    <rect x="70" y="148" width="100" height="72" rx="4" fill="url(#toyBoxGrad)" stroke-width="3"/>
    <!-- Diamond & star motif on box front -->
    <polygon points="120,162 138,184 120,206 102,184" fill="#fffaf4" fill-opacity="0.55" stroke="#5a3015" stroke-width="1.8"/>
    <circle cx="120" cy="184" r="5" fill="#7c4824" fill-opacity="0.6" stroke-width="1.6"/>
    <!-- Engraving hatching on box edges -->
    <g stroke="#5a3015" stroke-width="1" stroke-opacity="0.38">
      <line x1="76" y1="154" x2="76" y2="214"/>
      <line x1="80" y1="154" x2="80" y2="214"/>
      <line x1="164" y1="154" x2="164" y2="214"/>
      <line x1="160" y1="154" x2="160" y2="214"/>
    </g>

    <!-- Side wind-up crank handle -->
    <path d="M 170 184 L 188 184 L 188 170 L 198 170" stroke="#4a2510" stroke-width="3.2"/>
    <circle cx="201" cy="170" r="4.5" fill="#c99e77" stroke-width="2.2"/>
  </g>
</svg>
