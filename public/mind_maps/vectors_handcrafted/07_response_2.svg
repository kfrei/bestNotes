<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" fill="none">
  <defs>
    <radialGradient id="sunHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="68%" stop-color="#fde047" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunCore" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="48%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <linearGradient id="rayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Soft Glowing Corona Halo -->
  <circle cx="130" cy="100" r="66" fill="url(#sunHalo)"/>

  <!-- Scalloped Sun Corona Ring -->
  <path d="M 130 44 L 142 52 L 156 48 L 164 60 L 178 64 L 178 78 L 188 90
           L 182 104 L 186 118 L 174 128 L 170 142 L 156 144 L 146 154
           L 130 150 L 114 154 L 104 144 L 90 142 L 86 128 L 74 118
           L 78 104 L 72 90 L 82 78 L 82 64 L 96 60 L 104 48 L 118 52 Z"
        fill="#fef08a" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round" opacity="0.9"/>

  <!-- Inner Golden Sun Disk -->
  <circle cx="130" cy="100" r="40" fill="url(#sunCore)" stroke="#d97706" stroke-width="2.4"/>
  <circle cx="126" cy="95" r="28" stroke="#fef9c3" stroke-width="2.5" opacity="0.65"/>

  <!-- Crisp Radiating Sunbeams -->
  <g stroke="url(#rayGrad)" stroke-width="4" stroke-linecap="round">
    <line x1="98" y1="46" x2="84" y2="24"/>
    <line x1="162" y1="46" x2="174" y2="22"/>
    <line x1="184" y1="68" x2="218" y2="42"/>
    <line x1="196" y1="98" x2="236" y2="94"/>
    <line x1="192" y1="128" x2="230" y2="144"/>
    <line x1="74" y1="74" x2="52" y2="66"/>
    <line x1="64" y1="104" x2="18" y2="108"/>
    <line x1="72" y1="132" x2="26" y2="162"/>
    <line x1="92" y1="152" x2="66" y2="186"/>
    <line x1="112" y1="162" x2="96" y2="212"/>
    <line x1="134" y1="164" x2="134" y2="206"/>
    <line x1="158" y1="158" x2="174" y2="192"/>
  </g>

  <!-- Two Curved Light-Ray Arrows (Down-Right, matching original) -->
  <g fill="url(#rayGrad)" stroke="#d97706" stroke-width="1.4" stroke-linejoin="round">
    <path d="M 182 146 C 202 164, 218 186, 226 208 L 234 205 L 228 228 L 210 212 L 218 210 C 210 188, 196 168, 178 150 Z"/>
    <path d="M 174 198 C 184 214, 194 226, 206 238 L 212 232 L 214 252 L 194 246 L 200 242 C 188 230, 178 216, 169 201 Z"/>
  </g>
</svg>
