<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 380" width="240" height="380" fill="none">
  <defs>
    <linearGradient id="lungL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c8b4"/>
      <stop offset="55%" stop-color="#e89d82"/>
      <stop offset="100%" stop-color="#c9745b"/>
    </linearGradient>
    <linearGradient id="lungR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7c8b4"/>
      <stop offset="55%" stop-color="#e89d82"/>
      <stop offset="100%" stop-color="#c9745b"/>
    </linearGradient>
    <linearGradient id="airway" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3e8"/>
      <stop offset="55%" stop-color="#5ec2d9"/>
      <stop offset="100%" stop-color="#3fa8c2"/>
    </linearGradient>
    <linearGradient id="arrowBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Subtle Head & Torso Silhouette Outline -->
  <path d="M 10 212 C 26 202, 48 192, 60 180 C 66 173, 68 158, 66 142
           C 48 126, 36 104, 38 76 C 40 36, 72 14, 110 16
           C 146 18, 168 42, 168 74 C 168 82, 170 88, 178 96
           C 184 102, 184 108, 176 112 C 174 114, 176 120, 172 124
           C 175 127, 174 132, 169 135 C 170 144, 167 152, 158 156
           C 149 160, 140 160, 134 162 C 132 174, 138 184, 156 194
           C 178 205, 198 214, 202 246 L 202 362"
        stroke="#4b5563" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left & Right Inner Torso Lines -->
  <path d="M 14 298 L 14 362" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 186 286 L 184 362" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Ear -->
  <path d="M 92 88 C 80 80, 68 92, 72 108 C 75 120, 86 124, 94 118"
        stroke="#4b5563" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M 88 97 C 81 94, 78 102, 82 109 C 84 113, 88 113, 90 110"
        stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Eyebrow & Closed Eye -->
  <path d="M 136 66 C 143 61, 151 61, 157 65" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
  <path d="M 140 82 C 146 86, 153 86, 158 81" stroke="#4b5563" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Hair tuft -->
  <path d="M 144 25 C 149 20, 154 20, 158 24" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Left Lung -->
  <path d="M 90 240 C 88 216, 78 204, 68 208 C 52 215, 36 248, 28 286
           C 22 316, 22 346, 30 356 C 36 363, 50 352, 68 344
           C 82 338, 92 330, 92 314 L 92 260 Z"
        fill="url(#lungL)" stroke="#7c5346" stroke-width="2.1" stroke-linejoin="round"/>
  <!-- Left Lung subtle lower shading -->
  <path d="M 30 354 C 44 342, 66 334, 88 326 C 89 336, 78 342, 62 348 C 46 355, 34 360, 30 354 Z"
        fill="#a35742" opacity="0.35"/>
  <!-- Left Lung top highlight -->
  <path d="M 68 218 C 56 226, 44 254, 38 286" stroke="#fff5f0" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Right Lung -->
  <path d="M 112 240 C 114 216, 124 204, 134 208 C 150 215, 166 248, 174 286
           C 180 316, 180 346, 172 356 C 166 363, 152 352, 134 344
           C 120 338, 110 330, 110 314 L 110 260 Z"
        fill="url(#lungR)" stroke="#7c5346" stroke-width="2.1" stroke-linejoin="round"/>
  <!-- Right Lung subtle lower shading -->
  <path d="M 172 354 C 158 342, 136 334, 114 326 C 113 336, 124 342, 140 348 C 156 355, 168 360, 172 354 Z"
        fill="#a35742" opacity="0.35"/>
  <!-- Right Lung top highlight -->
  <path d="M 134 218 C 146 226, 158 254, 164 286" stroke="#fff5f0" stroke-width="3.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Nasal Cavity, Pharynx, Trachea & Primary Bronchi -->
  <path d="M 172 112 C 162 110, 154 96, 136 96 C 114 96, 98 118, 96 154
           L 96 246 L 74 268 L 79 273 L 101 253 L 123 273 L 128 268 L 106 246
           L 106 160 C 108 142, 118 128, 136 125 C 148 123, 156 125, 164 126
           C 164 121, 152 118, 138 118 C 124 118, 114 124, 108 134
           C 112 118, 124 110, 142 110 C 156 110, 166 114, 172 112 Z"
        fill="url(#airway)" stroke="#33768a" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Trachea Cartilage Rings -->
  <g stroke="#2a687a" stroke-width="1.3" stroke-linecap="round" opacity="0.65">
    <line x1="97" y1="184" x2="105" y2="184"/>
    <line x1="97" y1="193" x2="105" y2="193"/>
    <line x1="97" y1="202" x2="105" y2="202"/>
    <line x1="97" y1="211" x2="105" y2="211"/>
    <line x1="97" y1="220" x2="105" y2="220"/>
    <line x1="97" y1="229" x2="105" y2="229"/>
    <line x1="97" y1="238" x2="105" y2="238"/>
  </g>

  <!-- Delicate Branching Bronchioles inside Left Lung -->
  <g stroke="#3d8ba0" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 76 270 C 66 276, 54 282, 44 294" stroke-width="2.4"/>
    <path d="M 76 270 C 70 258, 66 246, 62 238" stroke-width="1.8"/>
    <path d="M 68 256 C 60 254, 54 252, 50 248" stroke-width="1.3"/>
    <path d="M 62 280 C 56 272, 48 268, 42 268" stroke-width="1.4"/>
    <path d="M 64 282 C 62 296, 58 310, 50 324" stroke-width="1.9"/>
    <path d="M 56 306 C 48 308, 42 312, 38 318" stroke-width="1.3"/>
    <path d="M 60 302 C 68 308, 74 316, 76 324" stroke-width="1.3"/>
  </g>

  <!-- Delicate Branching Bronchioles inside Right Lung -->
  <g stroke="#3d8ba0" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 126 270 C 136 276, 148 282, 158 294" stroke-width="2.4"/>
    <path d="M 126 270 C 132 258, 136 246, 140 238" stroke-width="1.8"/>
    <path d="M 134 256 C 142 254, 148 252, 152 248" stroke-width="1.3"/>
    <path d="M 140 280 C 146 272, 154 268, 160 268" stroke-width="1.4"/>
    <path d="M 138 282 C 140 296, 144 310, 152 324" stroke-width="1.9"/>
    <path d="M 146 306 C 154 308, 160 312, 164 318" stroke-width="1.3"/>
    <path d="M 142 302 C 134 308, 128 316, 126 324" stroke-width="1.3"/>
  </g>

  <!-- Airflow Arrows (Nose & Mouth) -->
  <g fill="url(#arrowBlue)">
    <path d="M 186 112 C 200 109, 210 100, 219 86 L 213 83 L 228 74 L 227 91 L 222 88 C 212 104, 201 114, 187 116 Z"/>
    <path d="M 184 128 C 198 129, 210 125, 221 116 L 217 111 L 233 108 L 227 123 L 223 119 C 212 129, 198 134, 184 132 Z"/>
  </g>
</svg>
