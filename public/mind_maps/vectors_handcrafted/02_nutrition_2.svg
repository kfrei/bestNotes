<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 400" width="240" height="400" fill="none">
  <defs>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5a2b"/>
      <stop offset="18%" stop-color="#b5804a"/>
      <stop offset="55%" stop-color="#d8ab79"/>
      <stop offset="100%" stop-color="#ebd0ae"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9e86a"/>
      <stop offset="55%" stop-color="#9cc63f"/>
      <stop offset="100%" stop-color="#6b9424"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7ebd2"/>
      <stop offset="100%" stop-color="#dfc293"/>
    </linearGradient>
    <radialGradient id="dropGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>

  <!-- Soil Cross-Section -->
  <path d="M 18 228 Q 68 223, 120 226 Q 172 223, 222 228
           L 214 274 L 220 304 L 204 342 L 194 368 L 164 382
           L 124 388 L 82 384 L 46 364 L 30 326 L 22 282 Z"
        fill="url(#soilGrad)"/>
  <!-- Top dark soil crust -->
  <path d="M 18 228 Q 70 222, 120 226 Q 170 222, 222 228 Q 172 238, 120 236 Q 68 238, 18 228 Z"
        fill="#5c3818" opacity="0.72"/>
  <!-- Organic soil pebbles/texture dots -->
  <g fill="#6b421f" opacity="0.28">
    <circle cx="48" cy="252" r="2.2"/><circle cx="72" cy="244" r="1.6"/>
    <circle cx="176" cy="248" r="2.4"/><circle cx="198" cy="264" r="1.8"/>
    <circle cx="42" cy="296" r="2"/><circle cx="188" cy="312" r="2.2"/>
    <circle cx="64" cy="346" r="1.8"/><circle cx="158" cy="356" r="2"/>
    <circle cx="102" cy="368" r="1.6"/><circle cx="144" cy="262" r="1.5"/>
  </g>

  <!-- Branching Roots -->
  <g stroke="#5c3c1e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="url(#rootGrad)">
    <path d="M 122 224 C 122 240, 114 256, 102 276 C 92 292, 80 310, 72 332
             L 78 334 C 86 314, 98 298, 108 282 C 110 302, 108 326, 104 352
             L 111 354 C 116 326, 118 302, 118 280 C 126 298, 134 320, 136 358
             L 142 356 C 140 322, 134 298, 128 278 C 142 292, 158 310, 172 330
             L 178 326 C 164 304, 148 284, 132 266 C 148 266, 170 272, 196 286
             L 199 280 C 174 265, 152 258, 134 254 C 150 248, 168 246, 186 248
             L 187 243 C 166 240, 146 242, 130 246 L 128 224 Z"/>
    <path d="M 118 242 C 98 246, 76 254, 52 274 L 56 279 C 78 260, 98 254, 116 250 Z"/>
    <path d="M 112 258 C 92 268, 72 284, 54 304 L 59 308 C 76 289, 94 276, 110 266 Z"/>
    <path d="M 136 284 C 146 298, 152 316, 154 340 L 159 339 C 157 314, 150 296, 140 281 Z"/>
  </g>

  <!-- Water Absorption Arrows -->
  <g fill="#0ea5e9" stroke="#0369a1" stroke-width="1.1" stroke-linejoin="round">
    <path d="M 32 320 L 68 296 L 64 291 L 84 287 L 73 304 L 70 299 L 35 324 Z"/>
    <path d="M 62 378 L 86 346 L 80 342 L 98 332 L 92 352 L 88 348 L 66 381 Z"/>
  </g>

  <!-- Glossy Water Droplets -->
  <g stroke="#0369a1" stroke-width="1.2">
    <path d="M 52 278 C 52 278, 41 291, 41 297 A 11 11 0 0 0 63 297 C 63 291, 52 278, 52 278 Z" fill="url(#dropGrad)"/>
    <path d="M 46 332 C 46 332, 37 343, 37 348 A 9 9 0 0 0 55 348 C 55 343, 46 332, 46 332 Z" fill="url(#dropGrad)"/>
    <path d="M 152 338 C 152 338, 143 349, 143 354 A 9 9 0 0 0 161 354 C 161 349, 152 338, 152 338 Z" fill="url(#dropGrad)"/>
    <path d="M 184 304 C 184 304, 174 316, 174 322 A 10 10 0 0 0 194 322 C 194 316, 184 304, 184 304 Z" fill="url(#dropGrad)"/>
    <path d="M 186 348 C 186 348, 178 358, 178 363 A 8 8 0 0 0 194 363 C 194 358, 186 348, 186 348 Z" fill="url(#dropGrad)"/>
  </g>

  <!-- Main Plant Stem -->
  <path d="M 122 228 C 122 184, 120 132, 124 80" stroke="#4d6d1d" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 122 228 C 122 184, 120 132, 124 80" stroke="#9ec93e" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Top Leaf -->
  <path d="M 124 84 C 110 56, 134 22, 172 10 C 164 46, 146 74, 124 84 Z"
        fill="url(#leafGrad)" stroke="#3f5d15" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 125 82 C 138 56, 152 34, 168 15" stroke="#4d6d1d" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Upper-Left Leaf -->
  <path d="M 121 128 C 86 120, 62 94, 42 54 C 82 58, 114 82, 121 128 Z"
        fill="url(#leafGrad)" stroke="#3f5d15" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 119 124 C 98 98, 74 78, 48 58" stroke="#4d6d1d" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 96 98 L 76 92 M 82 84 L 84 68" stroke="#4d6d1d" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Middle-Right Leaf -->
  <path d="M 124 148 C 132 104, 168 80, 214 96 C 194 128, 164 150, 124 148 Z"
        fill="url(#leafGrad)" stroke="#3f5d15" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 128 144 C 154 122, 180 106, 208 98" stroke="#4d6d1d" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 154 126 L 176 126 M 168 116 L 178 102" stroke="#4d6d1d" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Lower-Left Small Leaf -->
  <path d="M 120 176 C 102 154, 78 150, 64 166 C 72 184, 96 184, 120 176 Z"
        fill="url(#leafGrad)" stroke="#3f5d15" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M 116 174 C 98 168, 82 166, 70 166" stroke="#4d6d1d" stroke-width="1.1" stroke-linecap="round"/>
</svg>
