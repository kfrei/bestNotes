<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 360" width="260" height="360" fill="none">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde3c8"/>
      <stop offset="70%" stop-color="#f5cba3"/>
      <stop offset="100%" stop-color="#e5b082"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b88c5a"/>
      <stop offset="55%" stop-color="#8b6239"/>
      <stop offset="100%" stop-color="#5c3d1e"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5bb5b0"/>
      <stop offset="65%" stop-color="#3d9692"/>
      <stop offset="100%" stop-color="#2a726f"/>
    </linearGradient>
    <radialGradient id="appleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e4f584"/>
      <stop offset="48%" stop-color="#a3cf3d"/>
      <stop offset="100%" stop-color="#658c1e"/>
    </radialGradient>
  </defs>

  <!-- Back Arm -->
  <path d="M 24 282 L 24 344 C 36 348, 52 348, 60 344 L 60 284 Z"
        fill="url(#skinGrad)" stroke="#3b2818" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- T-Shirt Torso -->
  <path d="M 52 178 C 28 192, 16 218, 8 278 L 62 286 L 62 344 C 92 348, 126 346, 140 342
           L 138 282 L 154 274 L 166 248 C 148 216, 134 194, 114 184 Z"
        fill="url(#shirtGrad)" stroke="#1e3a3a" stroke-width="2.3" stroke-linejoin="round"/>
  <!-- T-Shirt Collar & Sleeve Seam -->
  <path d="M 54 178 C 66 200, 96 206, 112 186" stroke="#1e3a3a" stroke-width="2.2" fill="none"/>
  <path d="M 10 270 L 60 278" stroke="#1e3a3a" stroke-width="1.6" opacity="0.65"/>

  <!-- Neck & Head Profile -->
  <path d="M 58 176 L 66 152 C 50 140, 42 122, 42 96 C 42 54, 72 28, 108 30
           C 138 32, 152 54, 152 78 C 152 84, 154 90, 162 96
           C 167 100, 165 106, 158 108 C 160 112, 162 116, 160 120
           C 150 122, 136 130, 136 142 C 136 154, 146 160, 152 162
           C 150 172, 142 178, 128 176 C 122 175, 114 172, 108 172
           L 104 192 C 88 202, 68 194, 58 176 Z"
        fill="url(#skinGrad)" stroke="#3b2818" stroke-width="2.3" stroke-linejoin="round"/>

  <!-- Rosy Cheek -->
  <ellipse cx="122" cy="116" rx="18" ry="12" fill="#f59e7a" opacity="0.32"/>

  <!-- Open Mouth (Biting Apple) -->
  <path d="M 158 120 C 142 122, 132 132, 134 146 C 136 156, 144 160, 152 158 Z"
        fill="#7f1d1d" stroke="#3b2818" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M 156 122 C 148 124, 142 128, 138 132 L 154 130 Z" fill="#ffffff"/>

  <!-- Eyebrow & Happy Closed Eye -->
  <path d="M 110 74 C 118 68, 128 66, 136 69" stroke="#3b2818" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 116 92 C 124 95, 132 94, 138 89" stroke="#3b2818" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Tousled Chestnut Hair -->
  <path d="M 60 154 C 36 146, 18 124, 14 96 C 10 64, 24 38, 52 24
           C 74 14, 102 10, 130 22 C 142 28, 152 38, 152 52
           C 142 42, 130 38, 122 46 C 118 36, 106 36, 98 48
           C 94 40, 82 44, 78 60 C 74 74, 76 92, 82 106
           C 72 100, 62 106, 62 118 C 62 130, 72 138, 82 136
           C 74 146, 68 152, 60 154 Z"
        fill="url(#hairGrad)" stroke="#3b2818" stroke-width="2.1" stroke-linejoin="round"/>
  <!-- Hair Texture Strands -->
  <path d="M 38 66 C 46 52, 62 40, 82 34 M 28 92 C 36 74, 52 60, 68 54 M 76 28 C 94 22, 114 24, 132 34"
        stroke="#4a2e14" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>

  <!-- Ear -->
  <path d="M 76 112 C 62 102, 50 116, 56 132 C 60 144, 74 146, 82 138"
        fill="url(#skinGrad)" stroke="#3b2818" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M 72 120 C 64 118, 62 126, 66 132" stroke="#5c3d1e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Green Apple with Bite -->
  <path d="M 152 130 C 164 116, 188 118, 198 134 C 208 150, 202 174, 186 182
           C 170 188, 150 180, 146 164 C 154 156, 156 140, 152 130 Z"
        fill="url(#appleGrad)" stroke="#365314" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Apple Highlight & Bite Pulp -->
  <ellipse cx="168" cy="136" rx="6" ry="10" transform="rotate(-24 168 136)" fill="#ffffff" opacity="0.55"/>
  <path d="M 152 130 C 158 140, 156 154, 148 162 C 142 152, 144 138, 152 130 Z"
        fill="#fef9c3" stroke="#658c1e" stroke-width="1.2"/>

  <!-- Forearm & Hand Holding Apple -->
  <path d="M 140 276 C 158 294, 178 308, 190 296 C 202 284, 206 244, 202 204
           C 214 192, 222 174, 218 154 C 214 142, 202 136, 194 140
           C 186 144, 184 154, 190 162 C 182 158, 176 164, 178 172
           C 172 172, 168 180, 172 190 L 176 212 C 174 236, 170 256, 160 264
           L 148 258 Z"
        fill="url(#skinGrad)" stroke="#3b2818" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Fingers Curled Around Apple -->
  <path d="M 194 142 C 204 148, 210 158, 208 172 M 186 150 C 196 156, 202 166, 200 178 M 180 160 C 188 166, 192 174, 190 184"
        stroke="#3b2818" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Small Floating Green Leaf (matching original) -->
  <path d="M 234 156 C 240 144, 246 138, 252 138 C 252 146, 246 154, 234 156 Z"
        fill="#a3cf3d" stroke="#365314" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
