<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" fill="none">
  <defs>
    <linearGradient id="seedSoil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a5a32"/>
      <stop offset="28%" stop-color="#b88454"/>
      <stop offset="72%" stop-color="#d9b082"/>
      <stop offset="100%" stop-color="#edd1ae"/>
    </linearGradient>
    <linearGradient id="seedCoat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a6b3e"/>
      <stop offset="55%" stop-color="#6e4422"/>
      <stop offset="100%" stop-color="#42250e"/>
    </linearGradient>
    <radialGradient id="seedCore" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#f7fee7"/>
      <stop offset="32%" stop-color="#d9f99d"/>
      <stop offset="72%" stop-color="#a3cf4b"/>
      <stop offset="100%" stop-color="#6d9926"/>
    </radialGradient>
  </defs>

  <!-- Soil Pocket -->
  <path d="M 12 42 Q 52 34, 72 44 L 154 42 Q 182 34, 208 44
           L 196 98 L 182 142 L 146 176 L 106 188 L 62 178 L 34 146 L 18 98 Z"
        fill="url(#seedSoil)"/>
  <!-- Soil Rim Shadow around Seed -->
  <ellipse cx="108" cy="76" rx="56" ry="50" fill="#4a2c14" opacity="0.28"/>
  <!-- Soil Organic Grain Dots -->
  <g fill="#5c3818" opacity="0.32">
    <circle cx="38" cy="72" r="2.2"/><circle cx="48" cy="108" r="2.6"/>
    <circle cx="64" cy="144" r="2.1"/><circle cx="96" cy="162" r="2.5"/>
    <circle cx="132" cy="154" r="2.2"/><circle cx="164" cy="126" r="2.4"/>
    <circle cx="176" cy="84" r="2"/><circle cx="84" cy="138" r="1.7"/>
    <circle cx="148" cy="108" r="1.9"/><circle cx="42" cy="134" r="1.6"/>
  </g>
  <!-- Top Soil Line -->
  <path d="M 12 42 Q 46 34, 68 42 M 154 42 Q 182 34, 208 44"
        stroke="#5c3818" stroke-width="2.2" stroke-linecap="round" opacity="0.65"/>

  <!-- Outer Brown Seed Coat -->
  <ellipse cx="108" cy="68" rx="46" ry="56" transform="rotate(14 108 68)"
           fill="url(#seedCoat)" stroke="#2c1708" stroke-width="2.6"/>
  <!-- Seed Coat Subtle Highlight -->
  <path d="M 74 42 C 84 22, 108 14, 128 22" stroke="#c89a6a" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>

  <!-- Inner Green Embryo / Cotyledon -->
  <ellipse cx="118" cy="72" rx="31" ry="43" transform="rotate(14 118 72)"
           fill="url(#seedCore)" stroke="#3f5d15" stroke-width="2.2"/>
  <!-- Glossy Specular Highlight on Seed Core -->
  <ellipse cx="114" cy="54" rx="7" ry="18" transform="rotate(24 114 54)" fill="#ffffff" opacity="0.72"/>
  <!-- Subtle Inner Fold -->
  <path d="M 106 102 C 122 98, 134 84, 138 64" stroke="#5c821e" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
</svg>
