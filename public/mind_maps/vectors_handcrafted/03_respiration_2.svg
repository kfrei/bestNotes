<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 360" width="260" height="360" fill="none">
  <defs>
    <linearGradient id="fishBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f7378"/>
      <stop offset="38%" stop-color="#7eb3ad"/>
      <stop offset="72%" stop-color="#d5e8e2"/>
      <stop offset="100%" stop-color="#f1f7f4"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc5648"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <radialGradient id="bubbleGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </radialGradient>
  </defs>

  <!-- Riverbed Sand & Pebbles -->
  <ellipse cx="132" cy="338" rx="94" ry="12" fill="#d6b48c" opacity="0.65"/>
  <g stroke="#574738" stroke-width="1.4" stroke-linejoin="round">
    <path d="M 52 338 C 52 324, 80 322, 86 338 Z" fill="#a89882"/>
    <path d="M 102 338 C 102 314, 134 300, 156 316 C 166 324, 166 338, 166 338 Z" fill="#b8a790"/>
    <path d="M 164 338 C 168 320, 198 318, 210 338 Z" fill="#9c8b75"/>
  </g>

  <!-- Aquatic Plants -->
  <g stroke="#365314" stroke-width="1.4" stroke-linejoin="round">
    <path d="M 96 334 C 86 314, 78 294, 76 274 C 86 290, 96 310, 102 334 Z" fill="#84cc16"/>
    <path d="M 102 334 C 98 308, 98 282, 104 258 C 110 282, 112 308, 108 334 Z" fill="#65a30d"/>
    <path d="M 176 334 C 164 306, 158 278, 160 250 C 170 274, 178 304, 184 334 Z" fill="#84cc16"/>
    <path d="M 184 334 C 184 298, 190 264, 202 228 C 204 264, 198 302, 192 334 Z" fill="#65a30d"/>
    <path d="M 192 334 C 204 306, 218 280, 232 258 C 224 286, 210 312, 198 334 Z" fill="#a3e635"/>
  </g>

  <!-- Dorsal Fin (Top) -->
  <path d="M 152 106 C 162 72, 184 44, 200 32 C 224 62, 236 98, 224 134 Z"
        fill="url(#finGrad)" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#334155" stroke-width="1.2" opacity="0.55">
    <line x1="164" y1="106" x2="196" y2="48"/>
    <line x1="178" y1="112" x2="210" y2="62"/>
    <line x1="194" y1="118" x2="220" y2="82"/>
    <line x1="208" y1="126" x2="225" y2="104"/>
  </g>

  <!-- Pelvic Fin (Bottom) -->
  <path d="M 128 228 C 128 252, 138 276, 154 284 C 166 272, 170 254, 164 236 Z"
        fill="url(#finGrad)" stroke="#334155" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Main Fish Body (Front Half Illustration) -->
  <path d="M 28 130 C 56 108, 108 98, 164 106 C 198 112, 224 128, 238 150
           L 238 228 C 216 244, 180 248, 140 236 C 98 222, 62 198, 34 166
           C 24 156, 20 148, 26 144 L 44 154 L 30 138 C 26 134, 26 132, 28 130 Z"
        fill="url(#fishBody)" stroke="#1e293b" stroke-width="2.3" stroke-linejoin="round"/>

  <!-- Subtle Crisp Scale Pattern -->
  <g stroke="#2d5a5e" stroke-width="1.1" opacity="0.32" fill="none">
    <path d="M 152 132 A 8 8 0 0 1 152 146 M 166 136 A 8 8 0 0 1 166 150 M 180 140 A 8 8 0 0 1 180 154 M 194 144 A 8 8 0 0 1 194 158 M 208 148 A 8 8 0 0 1 208 162"/>
    <path d="M 158 152 A 8 8 0 0 1 158 166 M 172 156 A 8 8 0 0 1 172 170 M 186 160 A 8 8 0 0 1 186 174 M 200 164 A 8 8 0 0 1 200 178 M 214 168 A 8 8 0 0 1 214 182"/>
    <path d="M 164 172 A 8 8 0 0 1 164 186 M 178 176 A 8 8 0 0 1 178 190 M 192 180 A 8 8 0 0 1 192 194 M 206 184 A 8 8 0 0 1 206 198"/>
  </g>

  <!-- Exposed Anatomical Gills (Βράγχια) with Fine Filaments! -->
  <path d="M 122 136 C 142 140, 148 166, 134 190 C 124 206, 108 214, 96 208
           C 110 192, 118 164, 122 136 Z"
        fill="url(#gillGrad)" stroke="#7f1d1d" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Gill Arches & Filament Lines -->
  <path d="M 124 142 C 136 152, 134 176, 114 200" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 118 148 C 128 158, 124 178, 106 202" stroke="#7f1d1d" stroke-width="1.3" stroke-linecap="round" opacity="0.7"/>
  <g stroke="#fee2e2" stroke-width="0.95" stroke-linecap="round" opacity="0.75">
    <line x1="126" y1="150" x2="136" y2="152"/>
    <line x1="126" y1="160" x2="137" y2="162"/>
    <line x1="124" y1="170" x2="135" y2="173"/>
    <line x1="119" y1="180" x2="130" y2="184"/>
    <line x1="112" y1="190" x2="122" y2="195"/>
  </g>

  <!-- Operculum Edge -->
  <path d="M 114 140 C 116 164, 106 188, 86 202" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Pectoral Fin -->
  <path d="M 142 188 C 166 186, 194 188, 212 198 C 194 214, 166 222, 140 212 Z"
        fill="#a7c8c2" fill-opacity="0.85" stroke="#334155" stroke-width="1.8" stroke-linejoin="round"/>
  <g stroke="#334155" stroke-width="1" opacity="0.5">
    <line x1="146" y1="195" x2="198" y2="197"/>
    <line x1="145" y1="202" x2="190" y2="206"/>
    <line x1="144" y1="208" x2="176" y2="213"/>
  </g>

  <!-- Fish Eye -->
  <circle cx="72" cy="140" r="13" fill="#fef08a" stroke="#1e293b" stroke-width="2"/>
  <circle cx="72" cy="140" r="7.5" fill="#0f172a"/>
  <circle cx="69" cy="137" r="2.6" fill="#ffffff"/>

  <!-- Water Flow Arrows (Mouth -> Gills) -->
  <g fill="#2563eb" stroke="#1d4ed8" stroke-width="0.8" stroke-linejoin="round">
    <path d="M 22 204 C 42 192, 62 184, 80 182 L 78 176 L 94 182 L 80 191 L 80 186 C 62 188, 44 196, 25 208 Z"/>
    <path d="M 98 200 C 76 206, 56 216, 40 232 L 45 236 L 28 244 L 34 226 L 38 229 C 54 212, 74 202, 96 196 Z"/>
  </g>

  <!-- Rising Water Bubbles -->
  <g stroke="#38bdf8" stroke-width="1.8">
    <circle cx="132" cy="24" r="13" fill="url(#bubbleGrad)"/>
    <circle cx="146" cy="56" r="8.5" fill="url(#bubbleGrad)"/>
    <circle cx="142" cy="78" r="4.5" fill="url(#bubbleGrad)"/>
    <circle cx="46" cy="292" r="9.5" fill="url(#bubbleGrad)"/>
    <circle cx="38" cy="316" r="6" fill="url(#bubbleGrad)"/>
  </g>
</svg>
