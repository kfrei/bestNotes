  <circle cx="104" cy="156" r="6" fill="#94a3b8" stroke="#fff" stroke-width="1"/><text x="104" y="112" text-anchor="middle" class="t-w" font-size="9.5">Ερμής</text><circle cx="136" cy="156" r="9" fill="#fcd34d" stroke="#fff" stroke-width="1"/><text x="136" y="208" text-anchor="middle" class="t-w" font-size="9.5">Αφροδίτη</text><circle cx="174" cy="156" r="10" fill="#2563eb" stroke="#fff" stroke-width="1"/><text x="174" y="112" text-anchor="middle" class="t-w" font-size="9.5">Γη</text><circle cx="210" cy="156" r="8" fill="#dc2626" stroke="#fff" stroke-width="1"/><text x="210" y="208" text-anchor="middle" class="t-w" font-size="9.5">Άρης</text><circle cx="262" cy="156" r="20" fill="#d97706" stroke="#fff" stroke-width="1"/><text x="262" y="112" text-anchor="middle" class="t-w" font-size="9.5">Δίας</text><circle cx="322" cy="156" r="16" fill="#eab308" stroke="#fff" stroke-width="1"/><ellipse cx="322" cy="156" rx="26" ry="6" fill="none" stroke="#fde68a" stroke-width="2.2"/><text x="322" y="208" text-anchor="middle" class="t-w" font-size="9.5">Κρόνος</text><circle cx="374" cy="156" r="12" fill="#38bdf8" stroke="#fff" stroke-width="1"/><text x="374" y="112" text-anchor="middle" class="t-w" font-size="9.5">Ουρανός</text><circle cx="418" cy="156" r="12" fill="#1d4ed8" stroke="#fff" stroke-width="1"/><text x="418" y="208" text-anchor="middle" class="t-w" font-size="9.5">Ποσειδώνας</text>
  <rect x="16" y="266" width="428" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="230" y="285" text-anchor="middle" class="t-lbl" fill="#1e3a8a">4 Εσωτερικοί (βραχώδεις) + 4 Εξωτερικοί (αέριοι γίγαντες)</text>

