<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

  <!-- Beaker -->
  <path d="M 96 40 L 96 208 Q 96 216 106 216 L 254 216 Q 264 216 264 208 L 264 40"
        stroke="#334155" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Water -->
