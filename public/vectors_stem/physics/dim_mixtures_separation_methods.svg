    <radialGradient id="sun-g" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
