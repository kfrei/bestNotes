  <text x="196" y="116" font-size="13" font-weight="700" fill="#dc2626">Fκ, aκ</text>
  <text x="180" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Ομαλή Κυκλική Κίνηση (aκ = u² / R)</text>

