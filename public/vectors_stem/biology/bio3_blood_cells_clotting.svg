    <text x="68" y="164" text-anchor="middle" class="t-sm">Αιμοσφαιρίνη (Hb)</text>
    <text x="68" y="180" text-anchor="middle" class="t-sm">Μεταφορά O₂ / CO₂</text>
  </g>
  <g transform="translate(162,40)">
